GlobalParameters:
  NumElementsToValidate: 128
  KernelTime: True
  MaxWorkspaceSize: 67108864
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 4
  SleepPercent: 0

BenchmarkProblems:
  -
    - # NT layout — HHS_BH fp16 WMMA — DirectToVgpr sweep
      OperationType: GEMM
      DataType: H
      DestDataType: H
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # Test DirectToVgprA and DirectToVgprB independently + baseline
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
      ForkParameters:
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  4,4,  1,1]   # MT64x64, MIWaveGroup=[1,1]
        - WorkGroup:
          - [32, 1, 1]
        - SourceSwap: [0]
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [16]
        - TransposeLDS: [0]
        # VW=4 required for DTVA (must match GLVWA for TLU + numBytes<4)
        - VectorWidth: [4]
        - GlobalReadVectorWidth: [4]
        # DTV requires WSGR=0 for the DTV operand — lock both to 0
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        # The sweep variable: DirectToVgpr A and B
        - DirectToVgprA: [False, True]
        - DirectToVgprB: [False, True]
        - StaggerU: [16]
        - GlobalSplitU: [1]
        - OptNoLoadLoop: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 1024]
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [4096, 4096, 1, 4096]
