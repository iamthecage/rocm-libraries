  KernelTime: True
  MaxWorkspaceSize: 67108864
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 4
  SleepPercent: 0

BenchmarkProblems:
