TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  MaxWorkspaceSize: 67108864
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  -
    - # hgemm_wmma_v2_incremental_nn
      OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - WorkGroup:
          - [32, 1, 1]
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [16]
        - TransposeLDS: [0]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [4]
        - OptNoLoadLoop: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]

      # Keep tile-shape diversity in the fork set (biggest observed lever).
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  2,2,  1,1]   # MT32x32
          - [16, 16, 16, 1,  1,  4,4,  1,1]   # MT64x64
          - [16, 16, 16, 1,  1,  4,8,  1,1]   # MT64x128
          - [16, 16, 16, 1,  1,  8,4,  1,1]   # MT128x64

      # Incremental phase: tune one 2-way parameter at a time per tile fork.
      BenchmarkForkParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [2048, 2048, 1, 2048]
          - Exact: [4096, 4096, 1, 4096]
        - SourceSwap: [0, 1]
        - StaggerU: [0, 16]
        - WaveSeparateGlobalReadA: [0, 1]
        - WaveSeparateGlobalReadB: [0, 1]

      # Keep one winner per macro-tile so coverage remains broad.
      JoinParameters:
        - MacroTile
      BenchmarkJoinParameters:

      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64,   3584, 1, 4096]
          - Exact: [256,  4096, 1, 4096]
          - Exact: [1024, 7168, 1, 7168]
          - Exact: [2048, 8192, 1, 8192]
          - Exact: [4096, 8192, 1, 8192]
          - Exact: [8192, 8192, 1, 8192]

LibraryLogic:
  ScheduleName: "navi48"
  DeviceNames: ["Device 7550"]
  ArchitectureName: "gfx1201"
