# WMMA Tile Sweep — Validate tile shape as a fork-worthy parameter
# Purpose: Sweep 6 tile shapes across NT and NN layouts to measure variance
# All configs use [16,16,16,1] base (WMMA V2 path guaranteed)
# Only MI[4:8] (wave-tile/wave-group) vary — same v_wmma_f32_16x16x16_f16 instruction
#
# Tile configs:
#   [16,16,16,1, 1, 2,2, 1,1]  MT32×32   1 wave   32 ValuC VGPRs
#   [16,16,16,1, 1, 4,2, 1,1]  MT64×32   1 wave   64 ValuC VGPRs
#   [16,16,16,1, 1, 2,4, 1,1]  MT32×64   1 wave   64 ValuC VGPRs
#   [16,16,16,1, 1, 4,4, 1,1]  MT64×64   1 wave  128 ValuC VGPRs  (current best)
#   [16,16,16,1, 1, 4,4, 2,1]  MT128×64  2 waves 128 ValuC VGPRs
#   [16,16,16,1, 1, 4,4, 1,2]  MT64×128  2 waves 128 ValuC VGPRs
#
# Fixed to proven best: DU=16, PGR=0, GLVWA=4, SU=16
# Fork: 6 tiles × 2 WSGRA × 2 WSGRB = 24 per layout, 48 total
#
# Usage:
#   cd /home/iamthecage/rocm-libraries/shared/tensile/next-tuning/compile
#   export PYTHONPATH=/home/iamthecage/rocm-libraries/shared/tensile
#   python3 /home/iamthecage/rocm-libraries/shared/tensile/Tensile/bin/Tensile \
#     wmma_tile_sweep.yaml ./tile_output \
#     --arch gfx1201 --cxx-compiler /opt/rocm/bin/amdclang++ \
#     --no-merge-files -v \
#     --prebuilt-client /home/iamthecage/rocm-libraries/shared/tensile/next-cmake/build/tensile-client

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  MaxWorkspaceSize: 67108864
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  # ============================================================
  # Layout 1: NT — B transposed (Ailk_Bjlk)
  # ============================================================
  -
    - OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
      ForkParameters:
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  2,2,  1,1]   # MT32×32   1 wave
          - [16, 16, 16, 1,  1,  4,2,  1,1]   # MT64×32   1 wave
          - [16, 16, 16, 1,  1,  2,4,  1,1]   # MT32×64   1 wave
          - [16, 16, 16, 1,  1,  4,4,  1,1]   # MT64×64   1 wave  (baseline)
          - [16, 16, 16, 1,  1,  4,4,  2,1]   # MT128×64  2 waves
          - [16, 16, 16, 1,  1,  4,4,  1,2]   # MT64×128  2 waves
        # --- Fixed to proven best ---
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]
        - DepthU: [16]
        - TransposeLDS: [0]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [4]
        - SourceSwap: [0]
        - StaggerU: [16]
        - OptNoLoadLoop: [0]
        # --- Fork on wave-separate reads (interacts with tile shape) ---
        - WaveSeparateGlobalReadA: [0, 1]
        - WaveSeparateGlobalReadB: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [4096, 4096, 1, 4096]

  # ============================================================
  # Layout 2: NN — neither transposed (Ailk_Bljk)
  # ============================================================
  -
    - OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
      ForkParameters:
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  2,2,  1,1]   # MT32×32   1 wave
          - [16, 16, 16, 1,  1,  4,2,  1,1]   # MT64×32   1 wave
          - [16, 16, 16, 1,  1,  2,4,  1,1]   # MT32×64   1 wave
          - [16, 16, 16, 1,  1,  4,4,  1,1]   # MT64×64   1 wave  (baseline)
          - [16, 16, 16, 1,  1,  4,4,  2,1]   # MT128×64  2 waves
          - [16, 16, 16, 1,  1,  4,4,  1,2]   # MT64×128  2 waves
        # --- Fixed to proven best ---
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]
        - DepthU: [16]
        - TransposeLDS: [0]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [4]
        - SourceSwap: [0]
        - StaggerU: [16]
        - OptNoLoadLoop: [0]
        # --- Fork on wave-separate reads (interacts with tile shape) ---
        - WaveSeparateGlobalReadA: [0, 1]
        - WaveSeparateGlobalReadB: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [4096, 4096, 1, 4096]

LibraryLogic:
    ScheduleName: "navi48"
    DeviceNames: ["Device 7550"]
    ArchitectureName: "gfx1201"
