TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  MaxWorkspaceSize: 67108864
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  -
    - # NN — CU MODE A/B test — f16 HPA WMMA V2 (v_wmma_f32_16x16x16_f16)
      OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
      ForkParameters:
        - CUMode: [True]
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  4,4,  1,1]   # MT64×64, single wave
        - WorkGroup:
          - [32, 1, 1]
        - SourceSwap: [0, 1]
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [16, 32]
        - TransposeLDS: [0]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [1, 2, 4]
        - WaveSeparateGlobalReadA: [0, 1]
        - WaveSeparateGlobalReadB: [0, 1]
        - OptNoLoadLoop: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 4096, 1, 4096]
          - Exact: [16, 8192, 1, 8192]
          - Exact: [16, 16384, 1, 16384]
          - Exact: [64, 4096, 1, 4096]
          - Exact: [64, 8192, 1, 8192]
          - Exact: [64, 16384, 1, 16384]
          - Exact: [256, 4096, 1, 4096]
          - Exact: [256, 8192, 1, 8192]
          - Exact: [256, 16384, 1, 16384]
          - Exact: [1024, 4096, 1, 4096]
          - Exact: [1024, 8192, 1, 8192]
          - Exact: [1024, 16384, 1, 16384]
          - Exact: [4096, 4096, 1, 4096]
          - Exact: [4096, 8192, 1, 8192]
          - Exact: [4096, 16384, 1, 16384]
