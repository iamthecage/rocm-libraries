TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: True
  MaxWorkspaceSize: 33554432
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  -
    - # HGEMM HPA WMMA V2 — Scheduling algorithm coverage
      # Tests all ScheduleIterAlg variants (different instruction ordering):
      #   SIA 0: Baseline scheduling
      #   SIA 1: Aggressive prefetch overlapping
      #   SIA 2: Forced config (InnerUnroll, PLR, ExpandPointerSwap, 1LDSBuffer)
      #   SIA 3: Advanced scheduling for persistent kernels
      # Cross-product with PrefetchGlobalRead and PrefetchLocalRead
      OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
      ForkParameters:
        - MIArchVgpr: [True]
        - WavefrontSize: [32]
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 4, 4, 1, 1]
        - WorkGroup:
          - [32, 1, 1]
        - SourceSwap: [0]
        - DepthU: [16]
        - TransposeLDS: [0]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [1]
        - OptNoLoadLoop: [0]
        - ScheduleIterAlg: [0, 1, 2, 3]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [0, 1]
        - ScheduleLocalWrite: [0, 1]
        - ScheduleGlobalRead: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 32]   # 2 K-passes — needed for PGR=1

LibraryLogic:
    ScheduleName: "navi48"
    DeviceNames: ["Device 7550"]
    ArchitectureName: "gfx1201"
