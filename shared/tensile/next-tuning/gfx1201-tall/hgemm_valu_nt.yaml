TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: True
  MaxWorkspaceSize: 33554432
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  -
    - # NT HGEMM — HPA (f16 input, f32 accumulate, f16 output) — VALU path (no MI)
      # A row-major, B column-major (B transposed in storage)
      # VW=1, GRVW=1 ensures safe access regardless of B storage order
      # Single minimum-coverage problem: one 64x64 macro tile, one K-pass (DepthU=8)
      OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - WavefrontSize: [32]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [16, 16, 1]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - DepthU: [8]
        - VectorWidth: [2]
        - GlobalReadVectorWidth: [2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 16]  # one tile, two K-passes (required for PGR=1)

LibraryLogic:
    ScheduleName: "navi48"
    DeviceNames: ["Device 7550"]
    ArchitectureName: "gfx1201"
