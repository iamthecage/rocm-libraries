        - DepthU: [16]
        - TransposeLDS: [0, 1]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [1]
        - OptNoLoadLoop: [0]
        - ScheduleLocalWrite: [0]
        - ScheduleGlobalRead: [0]
        - ScheduleIterAlg: [0]
