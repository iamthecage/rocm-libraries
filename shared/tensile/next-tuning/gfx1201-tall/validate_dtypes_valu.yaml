TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1031, skip-gfx1032, skip-gfx1033, skip-gfx1034, skip-gfx1035, skip-gfx1036, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: True
  MaxWorkspaceSize: 33554432
  PrintSolutionRejectionReason: True
  MergeFiles: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  SleepPercent: 0

BenchmarkProblems:
  # ── SGEMM (f32) — VALU ──
  -
    - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - WavefrontSize: [32]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [16, 16, 1]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [8]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 16]

  # ── DGEMM (f64) — VALU ──
  -
    - OperationType: GEMM
      DataType: d
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - WavefrontSize: [32]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [16, 16, 1]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [4]
        - VectorWidth: [1]
        - GlobalReadVectorWidth: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 8]

  # ── HGEMM VALU (f16→f32, no WMMA) ──
  -
    - OperationType: GEMM
      DataType: h
      ComputeDataType: s
      DestDataType: h
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - WavefrontSize: [32]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [16, 16, 1]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [8]
        - VectorWidth: [2]
        - GlobalReadVectorWidth: [2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 16]

  # ── BF16 VALU (bf16→f32, no WMMA) ──
  -
    - OperationType: GEMM
      DataType: B
      ComputeDataType: s
      DestDataType: B
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - WavefrontSize: [32]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [16, 16, 1]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [8]
        - VectorWidth: [2]
        - GlobalReadVectorWidth: [2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 16]

LibraryLogic:
    ScheduleName: "navi48"
    DeviceNames: ["Device 7550"]
    ArchitectureName: "gfx1201"
